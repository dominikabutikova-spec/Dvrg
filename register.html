<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Страна подарков</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header"></header>

  <main class="container">
    <div class="auth-layout">
      <div class="auth-art" id="authArt">
        <div class="auth-art-copy">
          <h3>Больше поводов для радости</h3>
          <p>Создайте аккаунт — сохраняйте любимые подарки и возвращайтесь к ним в любой момент.</p>
        </div>
      </div>
      <div class="auth-card">
        <h1>Создать аккаунт</h1>
        <p class="auth-lead">Пара минут — и можно собирать подарки и следить за заказами.</p>
        <form id="registerForm">
          <div class="form-grid">
            <label class="field"><span>Имя *</span><input type="text" name="name" placeholder="Как к вам обращаться" required></label>
            <label class="field"><span>Телефон</span><input type="tel" name="phone" placeholder="+7 (___) ___-__-__"></label>
          </div>
          <label class="field"><span>Email *</span><input type="email" name="email" placeholder="you@example.ru" required></label>
          <label class="field"><span>Пароль *</span><input type="password" name="password" placeholder="Минимум 4 символа" minlength="4" required></label>
          <label class="field"><span>Адрес доставки</span><input type="text" name="address" placeholder="г. Элиста, улица, дом"></label>
          <button type="submit" class="btn btn-primary btn-block">Зарегистрироваться</button>
        </form>
        <p class="auth-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      </div>
    </div>
  </main>

  <footer class="footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/order.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const art = document.getElementById('authArt');
      art.insertAdjacentHTML('afterbegin', artToys(1));

      if (isLogged()) {
        location.href = 'account.html';
        return;
      }

      document.getElementById('registerForm').addEventListener('submit', function (event) {
        event.preventDefault();
        const form = event.target;
        try {
          register(
            form.name.value,
            form.email.value,
            form.password.value,
            form.phone.value,
            form.address.value
          );
          login(form.email.value, form.password.value);
          location.href = 'account.html';
        } catch (error) {
          showToast(error.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
